name: CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  pr_checks:
    name: PR Checks
    if: >-
      ${{
        github.event_name == 'pull_request'
        && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'github-actions[bot]' && startsWith(github.event.pull_request.title, '[release '))
      }}
    uses: ./.github/workflows/reusable_pr_checks.yml

  python_checks:
    name: Python checks
    uses: ./.github/workflows/reusable_python_checks.yml

  sec_checks:
    name: Security checks
    uses: ./.github/workflows/reusable_sec_checks.yml

  all_checks:
    name: All Checks
    if: always()
    runs-on: ubuntu-latest
    needs:
      - pr_checks
      - python_checks
      - sec_checks
    steps:
      - name: Check if all checks passed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJson(needs) }}
