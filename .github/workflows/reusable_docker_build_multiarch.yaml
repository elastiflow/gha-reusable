on:
  workflow_call:
    inputs:
      timeout_minutes:
        type: number
        default: 60
        description: "Workflow jobs timeout in minutes"
      matrix_runner:
        type: string
        required: true
        description: |
          Runners to execute the build on, in json format. E.g.:
          ```json
            ["ubuntu-latest-4c", "ubuntu-latest-arm-4c"]
          ```
      matrix_target:
        type: string
        required: true
        description: |
          Docker targets to build, in json format. E.g.:
          ```json
            ["runner", "runner-debug"]
          ```
      matrix_include_tag_suffix:
        type: string
        default: "[]"
        description: |
          Extra `push_multiarch` matrix fields. JSON list of `{"target": string, "tag_suffix": string}`
          matching `matrix_target`. Required when pushing more than one target so tags stay unique.

          Example producing `v0.1.0` and `v0.1.0-debug`:
          ```json
            matrix_target: '["runner", "runner-debug"]'
            matrix_include_tag_suffix: '[{"target": "runner", "tag_suffix": ""}, {"target": "runner-debug", "tag_suffix": "-debug"}]'
            version: v0.1.0
          ```

          Example producing `v0.1.0` when single target is built:
          ```json
            matrix_target: '["runner"]'
            version: v0.1.0
          ```
      runner_platform_map:
        type: string
        required: true
        description: |
          Runner to Docker build platform mapping in JSON format.
          Currently only supports linux/amd64 and linux/arm64 platforms.
          Example:
          ```json
            {
              "ubuntu-latest-4c": "linux/amd64",
              "ubuntu-latest-arm-4c": "linux/arm64"
            }
          ```
      dockerfile:
        type: string
        default: Dockerfile
        description: Dockerfile to be used to build image.
      context:
        type: string
        default: "."
        description: "Docker context"
      version:
        type: string
        required: true
        description: |
          Version to use for the built image, used as a tag prefix.
      build_args:
        type: string
        description: |
          Docker build args, example:

            build_args: |
              "SOME_DEP_VERSION=awesome-dependency:v1.1.1"
              "SOME_DEP_VERSION=awesome-dependency"
      build_secret_envs:
        type: string
        description: |
          "List of secret env vars to expose to the build (e.g., key=envname, MY_SECRET=MY_ENV_VAR)"

            build_secret_envs: |
              "SOME_SECRET=SOME_ENV_VAR"
      # Opinionated build secrets
      build_secret_npm_gcp:
        type: boolean
        default: false
        description: |
          Whether to configure GCP Artifact Registry credentials for NPM registry read access during the build.
      build_secret_npm_gcp_key:
        type: string
        default: "NPM_TOKEN"
        description: |
          Docker build secret key to use to inject GCP credentials into the build.
      build_secret_npm_gcp_project_id:
        type: string
        description: |
          GCP project id for the service account used to authenticate to GCP for NPM read access, must be provided if `build_secret_npm_gcp` is true.
      build_secret_npm_gcp_workload_identity_provider:
        type: string
        description: |
          GCP workload identity provider for the service account used to authenticate to GCP for NPM read access, must be provided if `build_secret_npm_gcp` is true.
      build_secret_npm_gcp_service_account:
        type: string
        description: |
          GCP service account email used to authenticate to GCP for NPM read access, must be provided if `build_secret_npm_gcp` is true.
      # Docker cache attrs
      cache_storage:
        type: string
        required: true
        description: |
          Registry provider to use for build cache.
          Currently supported values are "aws_ecr", "aws_s3", "gcp_ar" (artifact registry)
      cache_region:
        type: string
        description: |
          Region of the registry to use for build cache, applicable only when `cache_storage = aws_ecr/aws_s3`.
      cache_registry:
        type: string
        description: |
          Registry to use for build cache, required only when `cache_storage = gcp_ar`.
      cache_from:
        type: string
        required: true
        description: |
          `cache_from` for the docker/build-push-action, {0} and {1} must be present in the string:
          - {0} is substituted with `${ref_name}`
          - {1} is substituted with `${arch}-${target}` (arch os is obtained from the `runner_platform_map`)

          Example S3:
            ```yaml
            cache_from: |
              type=s3,region=us-east-2,bucket=ecr-cache-test-test-app-000000000000-us-east-2-an,name=${SOME_IMAGE}-{0}-{1}
              type=s3,region=us-east-2,bucket=ecr-cache-test-test-app-000000000000-us-east-2-an,name=${SOME_IMAGE}-main-{1}
              type=s3,region=us-east-2,bucket=ecr-cache-test-test-app-000000000000-us-east-2-an,name=${SOME_IMAGE}-beta-{1}
            ```

          Example registry:
            ```yaml
            cache_from: |
              type=registry,ref=000000000000.dkr.ecr.us-east-2.amazonaws.com/${SOME_IMAGE}:{0}-{1}
              type=registry,ref=000000000000.dkr.ecr.us-east-2.amazonaws.com/${SOME_IMAGE}:main-{1}
              type=registry,ref=000000000000.dkr.ecr.us-east-2.amazonaws.com/${SOME_IMAGE}:beta-{1}
            ```
      cache_to:
        type: string
        required: true
        description: |
          `cache_to` for the docker/build-push-action, {0} and {1} must be present in the string:
          - {0} is substituted with `${ref_name}`
          - {1} is substituted with `${arch}-${target}` (arch os is obtained from the `runner_platform_map`)

          Example S3:
            ```
            cache_to: |
              type=s3,mode=max,region=us-east-2,bucket=ecr-cache-test-test-app-000000000000-us-east-2-an,name=${SOME_IMAGE}-{0}-{1}
            ```

          Example registry:
            ```
            cache_to: |
              type=registry,mode=max,ref=000000000000.dkr.ecr.us-east-2.amazonaws.com/${SOME_IMAGE}:{0}-{1}
            ```
      # AWS attrs
      aws_push:
        type: boolean
        default: false
        description: |
          Whether to push the built image to AWS ECR.
      aws_image:
        type: string
        description: |
          Name of the image to build/push to AWS ECR, must be provided if `aws_push` is true.
      aws_registry:
        type: string
        description: |
          AWS ECR registry (account_id.dkr.ecr.region.amazonaws.com) to push, must be provided if `aws_push` is true.
      aws_region:
        type: string
        description: |
          AWS region where the ECR registry is located, must be provided if `aws_push` is true.
      aws_iam_role:
        type: string
        description: |
          AWS IAM role to assume for pushing to ECR, must be provided if `aws_push` is true or `cache_storage` is `aws_s3`/`aws_ecr`.
          - IAM role must have access to the `${aws_registry}/${aws_image}`
          - IAM role must have access to the relevant bucket defined in `cache_from`/`cache_to` if `cache_storage` is 'aws_s3'
          - IAM role must have access to the relevant ECR defined in `cache_from`/`cache_to` if `cache_storage` is 'aws_ecr'
      aws_token_lifetime:
        type: string
        default: "3600"
        description: |
          AWS IAM role token lifetime in seconds
      # GCP attrs
      gcp_push:
        type: boolean
        default: false
        description: |
          Whether to push the built image to GCP Artifact Registry.
      gcp_image:
        type: string
        description: |
          Name of the image to build/push to GCP Artifact Registry, must be provided if `gcp_push` is true.
      gcp_registry:
        type: string
        description: |
          GCP Artifact Registry hostname (e.g. region-docker.pkg.dev) to push, must be provided if `gcp_push` is true.
      gcp_project_id:
        type: string
        description: "GCP Artifact Registry project"
      gcp_workload_identity_provider:
        type: string
        description: "GCP Artifact Registry workload identity provider id (with numeric project id)"
      gcp_service_account:
        type: string
        description: |
          GCP Artifact Registry service account
          - Service Account must have access to the `${gcp_registry}/${gcp_image}`
          - Service Account must have access to the relevant Artifact Registry defined in `cache_from`/`cache_to` if `cache_storage` is `gcp_ar`
      gcp_token_lifetime:
        type: string
        default: "3600s"
        description: |
          GCP Service Account token lifetime
      # Github Container Registry attrs
      ghcr_push:
        type: boolean
        default: false
        description: |
          Whether to push the built image to GitHub Container Registry.
      ghcr_image:
        type: string
        description: |
          Name of the image to build/push to GitHub Container Registry, must be provided if `ghcr_push` is true. Should be in the format of `owner/repo/image`.
      ghcr_registry:
        type: string
        default: ghcr.io
        description: |
          GitHub Container Registry hostname.
      # Dockerhub attrs
      dockerhub_push:
        type: boolean
        default: false
        description: |
          Whether to push the built image to Dockerhub.
      dockerhub_image:
        type: string
        description: |
           Name of the image to build/push to Dockerhub, must be provided if `dockerhub_push` is true. Should be in the format of `owner/image`.
      dockerhub_registry:
        type: string
        default: docker.io
        description: |
          Dockerhub hostname.
    secrets:
      build_secrets:
        description: |
          "List of secrets to expose to the build (e.g., key=string, GIT_AUTH_TOKEN=mytoken)"

            build_secrets: |
              "SOME_SECRET=SOME_SECRET"
      dockerhub_username:
        description: Dockerhub username, must be provided if `dockerhub_push` is true.
      dockerhub_api_token:
        description: Dockerhub API token, must be provided if `dockerhub_push` is true.
    outputs:
      version:
        description: "Docker version that was built/pushed"
        value: ${{ inputs.version }}

jobs:
  docker_build_push:
    name: Docker build/push
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    strategy:
      matrix:
        runner: ${{ fromJson(inputs.matrix_runner) }}
        target: ${{ fromJson(inputs.matrix_target) }}
    env:
      MATRIX_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set standard vars
        id: standard_vars
        env:
          REF_NAME: ${{ github.ref_name }}
          PLATFORM: ${{ fromJson(inputs.runner_platform_map)[matrix.runner] }}
        run: |
          echo "ref_name=$(echo ${REF_NAME} | tr '/' '_')" >> $GITHUB_OUTPUT
          echo "arch=$(echo ${PLATFORM} | tr '/' '_')" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0

      # Opinionated list of temporary secrets to be used within the build process
      - name: Configure GCP Credentials (NPM read)
        if: ${{ inputs.build_secret_npm_gcp }}
        id: build_secret_npm_gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: "access_token"
          create_credentials_file: false
          export_environment_variables: false
          project_id: ${{ inputs.build_secret_npm_gcp_project_id }}
          workload_identity_provider: ${{ inputs.build_secret_npm_gcp_workload_identity_provider }}
          service_account: ${{ inputs.build_secret_npm_gcp_service_account }}

      # Configure caching registry creds
      ## Cache AWS ECR
      - name: Configure AWS Credentials (cache)
        if: ${{ contains(inputs.cache_storage, 'aws') }}
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: ${{ inputs.cache_region }}
          role-to-assume: ${{ inputs.aws_iam_role }}
          role-duration-seconds: ${{ inputs.aws_token_lifetime }}
      - name: Login to Amazon ECR (cache)
        if: ${{ inputs.cache_storage == 'aws_ecr' }}
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2.1.4
      ## Cache GCP Artifact Registry
      - name: Configure GCP Credentials (cache)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: ${{ contains(inputs.cache_storage, 'gcp') }}
        id: gcp_ar_auth_cache
        with:
          token_format: "access_token"
          project_id: ${{ inputs.gcp_project_id }}
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_service_account }}
          access_token_lifetime: ${{ inputs.gcp_token_lifetime }}
      - name: Login to GCP Artifact Registry (cache)
        if: ${{ inputs.cache_storage == 'gcp_ar' }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ inputs.cache_registry }}
          username: oauth2accesstoken
          password: ${{ steps.gcp_ar_auth_cache.outputs.access_token }}

      # Login to registries
      ## Login to AWS ECR
      - name: Configure AWS Credentials
        if: ${{ inputs.aws_push }}
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.aws_iam_role }}
          role-duration-seconds: ${{ inputs.aws_token_lifetime }}
      - name: Login to Amazon ECR
        if: ${{ inputs.aws_push }}
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2.1.4
      ## Login to GCP Artifact Registry
      - name: Configure GCP Credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: ${{ inputs.gcp_push }}
        id: gcp_ar_auth
        with:
          token_format: "access_token"
          project_id: ${{ inputs.gcp_project_id }}
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_service_account }}
          access_token_lifetime: ${{ inputs.gcp_token_lifetime }}
      - name: Login to GCP Artifact Registry
        if: ${{ inputs.gcp_push }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ inputs.gcp_registry }}
          username: oauth2accesstoken
          password: ${{ steps.gcp_ar_auth.outputs.access_token }}
      ## Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        if: ${{ inputs.ghcr_push }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ inputs.ghcr_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      ## Login to Dockerhub Container Registry
      - name: Login to Dockerhub Container Registry
        if: ${{ inputs.dockerhub_push }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ inputs.dockerhub_registry }}
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_api_token }}

      # Build/Push
      - name: Build/Push Docker image by digest
        id: build_push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          file: ${{ inputs.dockerfile }}
          platforms: ${{ fromJson(inputs.runner_platform_map)[matrix.runner] }}
          # No tag, only registry/image due to `outputs: push-by-digest=true,type=image,push=true`
          tags: |
            ${{ case(inputs.aws_push, format('{0}/{1}', inputs.aws_registry, inputs.aws_image), '') }}
            ${{ case(inputs.gcp_push, format('{0}/{1}', inputs.gcp_registry, inputs.gcp_image), '') }}
            ${{ case(inputs.ghcr_push, format('{0}/{1}', inputs.ghcr_registry, inputs.ghcr_image), '') }}
            ${{ case(inputs.dockerhub_push, format('{0}/{1}', inputs.dockerhub_registry, inputs.dockerhub_image), '') }}
          build-args: |
              ${{ inputs.build_args }}
          secrets: |
              ${{ case(inputs.build_secret_npm_gcp, format('{0}={1}', inputs.build_secret_npm_gcp_key, steps.build_secret_npm_gcp.outputs.access_token), '') }}
              ${{ secrets.build_secrets }}
          secret-envs: |
              ${{ inputs.build_secret_envs }}
          target: ${{ matrix.target }}
          context: "${{ inputs.context }}"
          cache-from: |
            ${{ format(inputs.cache_from, steps.standard_vars.outputs.ref_name, format('{0}-{1}', steps.standard_vars.outputs.arch, matrix.target)) }}
          cache-to: |
            ${{ format(inputs.cache_to, steps.standard_vars.outputs.ref_name, format('{0}-{1}', steps.standard_vars.outputs.arch, matrix.target)) }}
          load: "false"
          push: "false"
          outputs: "${{ case(inputs.aws_push || inputs.gcp_push || inputs.ghcr_push || inputs.dockerhub_push, 'push-by-digest=true,type=image,push=true', '') }}"
          provenance: "mode=max"
          sbom: "true"
          labels: ${{ steps.meta.outputs.labels }}

      - name: Save build digest
        if: &push_enabled >-
          ${{
            inputs.aws_push
            || inputs.dockerhub_push
            || inputs.gcp_push
            || inputs.ghcr_push
          }}
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
          ARCH: ${{ steps.standard_vars.outputs.arch }}
        run: printf '%s\n' "${DIGEST}" > "/tmp/digest_${MATRIX_TARGET}__${ARCH}.txt"
      - name: Upload build digest
        if: *push_enabled
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}__${{ steps.standard_vars.outputs.arch }}
          path: /tmp/digest_*.txt

  push_multiarch:
    name: Push multi-arch docker manifest
    runs-on: ubuntu-latest
    needs: [docker_build_push]
    if: *push_enabled
    strategy:
      matrix:
        target: ${{ fromJson(inputs.matrix_target) }}
        include: ${{ fromJson(inputs.matrix_include_tag_suffix) }}
    steps:
      - name: Download build digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ matrix.target }}__*
          path: /tmp/

      # Build/Push to AWS ECR
      - name: Configure AWS Credentials
        if: ${{ inputs.aws_push }}
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.aws_iam_role }}
      - name: Login to Amazon ECR
        if: ${{ inputs.aws_push }}
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2.1.4
      - name: Compose multi-arch image ECR
        if: ${{ inputs.aws_push }}
        id: compose_image_aws
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          IMAGE: ${{ inputs.aws_registry }}/${{ inputs.aws_image }}
          FULL_IMAGE: ${{ inputs.aws_registry }}/${{ inputs.aws_image }}:${{ inputs.version }}${{ matrix.tag_suffix }}
          CLOUD: aws
        run: &compose_multiarch |
          echo "## ${CLOUD}" >> $GITHUB_STEP_SUMMARY
          SRC_IMAGES=$(ls /tmp/${MATRIX_TARGET}__*/digest_${MATRIX_TARGET}__*.txt | while read -r i; do echo "${IMAGE}@$(cat "${i}")"; done)

          echo "Composing multi-arch image ${FULL_IMAGE}"

          docker buildx imagetools create \
            -t ${FULL_IMAGE} \
            $(echo ${SRC_IMAGES} | tr '\n' ' ')
          export DIGEST=$(docker buildx imagetools inspect ${FULL_IMAGE} --format='{{ json .Manifest }}' | jq -r '.digest')

          echo "Composed \`${FULL_IMAGE}\` from images" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${SRC_IMAGES}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Digest: \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY

          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
      - name: Generate artifact attestation AWS
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        if: ${{ inputs.aws_push }}
        with:
          subject-name: "${{ inputs.aws_registry }}/${{ inputs.aws_image }}"
          subject-digest: ${{ steps.compose_image_aws.outputs.digest }}
          push-to-registry: true

      # Build/push to GCP Artifact Registry
      - name: Configure GCP Credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: ${{ inputs.gcp_push }}
        id: gcp_ar_auth
        with:
          token_format: "access_token"
          project_id: ${{ inputs.gcp_project_id }}
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_service_account }}
          access_token_lifetime: ${{ inputs.gcp_token_lifetime }}
      - name: Login to GCP AR
        if: ${{ inputs.gcp_push }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ inputs.gcp_registry }}
          username: oauth2accesstoken
          password: ${{ steps.gcp_ar_auth.outputs.access_token }}
      - name: Compose multi-arch image GCP
        if: ${{ inputs.gcp_push }}
        id: compose_image_gcp
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          IMAGE: ${{ inputs.gcp_registry }}/${{ inputs.gcp_image }}
          FULL_IMAGE: ${{ inputs.gcp_registry }}/${{ inputs.gcp_image }}:${{ inputs.version }}${{ matrix.tag_suffix }}
          CLOUD: gcp
        run: *compose_multiarch
      - name: Generate artifact attestation GCP
        if: ${{ inputs.gcp_push }}
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: "${{ inputs.gcp_registry }}/${{ inputs.gcp_image }}"
          subject-digest: ${{ steps.compose_image_gcp.outputs.digest }}
          push-to-registry: true

      # Build/push to GHCR
      - name: Login to GHCR
        if: ${{ inputs.ghcr_push }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ inputs.ghcr_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compose multi-arch image GHCR
        if: ${{ inputs.ghcr_push }}
        id: compose_image_ghcr
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          IMAGE: ${{ inputs.ghcr_registry }}/${{ inputs.ghcr_image }}
          FULL_IMAGE: ${{ inputs.ghcr_registry }}/${{ inputs.ghcr_image }}:${{ inputs.version }}${{ matrix.tag_suffix }}
          CLOUD: ghcr
        run: *compose_multiarch
      - name: Generate artifact attestation GHCR
        if: ${{ inputs.ghcr_push }}
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: "${{ inputs.ghcr_registry }}/${{ inputs.ghcr_image }}"
          subject-digest: ${{ steps.compose_image_ghcr.outputs.digest }}
          push-to-registry: true

      # Build/push to Dockerhub
      - name: Login to Dockerhub
        if: ${{ inputs.dockerhub_push }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ inputs.dockerhub_registry }}
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_api_token }}
      - name: Compose multi-arch image Dockerhub
        if: ${{ inputs.dockerhub_push }}
        id: compose_image_dockerhub
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          IMAGE: ${{ inputs.dockerhub_registry }}/${{ inputs.dockerhub_image }}
          FULL_IMAGE: ${{ inputs.dockerhub_registry }}/${{ inputs.dockerhub_image }}:${{ inputs.version }}${{ matrix.tag_suffix }}
          CLOUD: dockerhub
        run: *compose_multiarch
      - name: Generate artifact attestation Dockerhub
        if: ${{ inputs.dockerhub_push }}
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: "${{ inputs.dockerhub_registry }}/${{ inputs.dockerhub_image }}"
          subject-digest: ${{ steps.compose_image_dockerhub.outputs.digest }}
          push-to-registry: true
