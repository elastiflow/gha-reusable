on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-latest
        description: "GHA runner for the job (ubuntu-latest, ubuntu-latest-4c, ubuntu-latest-8c)"
      timeout-minutes:
        type: number
        default: 5
        description: "Job timeout in minutes"

jobs:
  pr_title_lint:
    name: 'pr-title-lint'
    runs-on: ${{ inputs.runs-on }}
    container: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Clean
        run:  |
          find . -mindepth 1 -maxdepth 1 -not -name '*commitlintrc*' -exec rm -rf {} \;
      - name: Validate PR commits with commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          bun install --dev @commitlint/config-conventional
          echo "${PR_TITLE}" | bunx commitlint --verbose
